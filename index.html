<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti - Con Amor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0b091a, #1c1533);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            position: relative;
        }

        /* Título superior animado */
        .title {
            color: #fff;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.8), 0 0 20px rgba(255, 182, 193, 0.5);
            margin-bottom: 20px;
            text-align: center;
            opacity: 0;
            animation: fadeIn 2s ease-in-out forwards;
            animation-delay: 1s;
            z-index: 10;
        }

        /* Estrellas de fondo animadas */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite;
        }

        /* Contenedor del jardín de lirios */
        .flower-garden {
            position: relative;
            width: 300px;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* El tallo principal que crece */
        .stem {
            position: absolute;
            bottom: 0;
            width: 8px;
            height: 0;
            background: linear-gradient(to top, #2e5c1e, #478c2d);
            border-radius: 4px;
            animation: growStem 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* Las hojas que brotan */
        .leaf {
            position: absolute;
            width: 40px;
            height: 15px;
            background: #478c2d;
            border-radius: 0 100px 0 100px;
            opacity: 0;
            transform-origin: left bottom;
        }

        .leaf.left {
            left: -32px;
            transform: rotate(-30px) scale(0);
            animation: popLeafLeft 1.5s ease-in-out forwards;
            animation-delay: 2s;
        }

        .leaf.right {
            right: -32px;
            transform: scaleX(-1) rotate(-30deg) scale(0);
            border-radius: 0 100px 0 100px;
            animation: popLeafRight 1.5s ease-in-out forwards;
            animation-delay: 2.5s;
        }

        /* El capullo del lirio */
        .lily-head {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            width: 100px;

            height: 100px;
            animation: bloom 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            animation-delay: 3s;
        }

        /* Pétalos estilizados de Lirio (Forma alargada y elegante) */
        .petal {
            position: absolute;
            top: 10px;
            left: 35px;
            width: 30px;
            height: 75px;
            background: linear-gradient(to bottom, #ffffff, #fff0f5);
            border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
            box-shadow: inset 0 0 10px rgba(255, 192, 203, 0.4), 0 0 10px rgba(255, 255, 255, 0.6);
            transform-origin: bottom center;
        }

        /* Disposición geométrica para abrir el lirio hacia afuera */
        .petal-1 { transform: rotate(0deg); }
        .petal-2 { transform: rotate(35deg); }
        .petal-3 { transform: rotate(-35deg); }
        .petal-4 { transform: rotate(70deg); }
        .petal-5 { transform: rotate(-70deg); }
        
        /* El centro del lirio (Pistilos y estambres) */
        .center-pistil {
            position: absolute;
            bottom: 15px;
            left: 48px;
            width: 4px;
            height: 40px;
            background: #d4af37;
            border-radius: 2px;
            transform-origin: bottom center;
            box-shadow: 0 0 8px #ffeb3b;
        }

        .pistil-left { transform: rotate(-15deg); }
        .pistil-right { transform: rotate(15deg); }

        /* Corazón flotante final */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 1.5rem;
            bottom: 200px;
            opacity: 0;
            animation: floatHeart 4s ease-in-out infinite;
        }

        /* --- ANIMACIONES CSS --- */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes growStem {
            to { height: 280px; }
        }

        @keyframes popLeafLeft {
            to { opacity: 1; transform: rotate(15deg) scale(1); }
        }

        @keyframes popLeafRight {
            to { opacity: 1; transform: scaleX(-1) rotate(15deg) scale(1); }
        }

        @keyframes bloom {
            to { transform: translateX(-50%) scale(1.2); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes floatHeart {
            0% { transform: translateY(0) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-100px) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="title">Para Ti - Te quiero Maria 🌸</div>
    
    <div class="stars" id="starfield"></div>

    <div class="flower-garden">
        <div class="stem">
            <div class="leaf left" style="top: 100px;"></div>
            <div class="leaf right" style="top: 160px;"></div>
            
            <div class="lily-head">
                <div class="petal petal-4"></div>
                <div class="petal petal-5"></div>
                <div class="petal petal-2"></div>
                <div class="petal petal-3"></div>
                <div class="petal petal-1"></div>
                <div class="center-pistil"></div>
                <div class="center-pistil pistil-left"></div>
                <div class="center-pistil pistil-right"></div>
            </div>
        </div>
    </div>

    <script>
        // Generador automático de estrellas de fondo
        const starfield = document.getElementById('starfield');
        const starCount = 60;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            const size = Math.random() * 3 + 1;
            star.style.width = ${size}px;
            star.style.height = ${size}px;
            
            star.style.top = ${Math.random() * 100}%;
            star.style.left = ${Math.random() * 100}%;
            
            star.style.setProperty('--duration', ${Math.random() * 3 + 2}s);
            starfield.appendChild(star);
        }

        // Generar corazones flotantes después de que florezca
        setTimeout(() => {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = ${Math.random() * 80 + 10}%;
                heart.style.animationDuration = ${Math.random() * 2 + 3}s;
                document.body.appendChild(heart);
                
                setTimeout(() => heart.remove(), 4000);
            }, 700);
        }, 4000);
    </script>
</body>
</html>
